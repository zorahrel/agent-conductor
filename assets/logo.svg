<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0f172a"/>
  <g transform="translate(48,56)" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Conductor baton (left) -->
    <line x1="20" y1="20" x2="60" y2="60"/>
    <circle cx="16" cy="16" r="6" fill="url(#g)" stroke="none"/>
    <!-- Three sessions / panes connected to baton -->
    <rect x="80" y="0" width="80" height="32" rx="6"/>
    <rect x="80" y="56" width="80" height="32" rx="6"/>
    <rect x="80" y="112" width="80" height="32" rx="6"/>
    <!-- Connecting lines from baton tip to each pane -->
    <line x1="60" y1="60" x2="80" y2="16"/>
    <line x1="60" y1="60" x2="80" y2="72"/>
    <line x1="60" y1="60" x2="80" y2="128"/>
  </g>
  <text x="128" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">agent-conductor</text>
</svg>
